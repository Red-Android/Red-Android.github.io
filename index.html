<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>red-android // ECSE Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="custom-cursor-dot"></div>
    <div class="custom-cursor-ring"></div>

    <div id="master-page-wrapper">
        <div class="top-layout-grid">
            <header>
                <div class="system-status">
                    <div class="status-badge">
                        <div class="pulse-dot"></div>
                        <span class="mono">SYSTEM_OPERATIONAL // RUNNING</span>
                    </div>
                </div>
                <h1 id="profile-name">--------</h1>
                <p class="subtitle" id="profile-discipline">--------</p>
            </header>

            <aside id="socials-vertical-rail">
            </aside>
        </div>

        <main>
            <section>
                <h2>01 // Core Vision</h2>
                <div class="vision-card" id="profile-vision">--------</div>
            </section>

            <section>
                <h2>02 // Academic Infrastructure</h2>
                <div class="grid" id="academic-grid">
                </div>
            </section>

            <section>
                <h2>03 // System Skills Matrix</h2>
                <div class="grid" id="skills-grid">
                </div>
            </section>

            <section>
                <h2>04 // Active Registries</h2>
                <div class="grid" id="registries-grid">
                </div>
            </section>
        </main>
    </div>

    <div class="overlay-panel-container" id="system-overlay-panel">
        <div class="overlay-panel-box" id="system-overlay-box">
            <button class="overlay-close-trigger" id="overlay-close-btn">✕</button>
            <div class="overlay-data-payload">
                <div class="status-badge" style="margin-bottom: 24px; display: inline-flex;">
                    <div class="pulse-dot"></div>
                    <span class="mono" id="overlay-node-id">SYSTEM_INFO_READOUT</span>
                </div>
                <h3 id="overlay-title" class="accent-title-glow">--------</h3>
                <div class="tags" id="overlay-tags" style="margin: 24px 0;"></div>
                <p id="overlay-desc" class="mono-text-stream">--------</p>
            </div>
        </div>
    </div>

    <script>
        async function loadPortfolio() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                
                document.getElementById('profile-name').textContent = data.name;
                document.getElementById('profile-discipline').textContent = data.bio;
                document.getElementById('profile-vision').textContent = data.vision;

                // Render Academic Infrastructure Loop (Restored to Full Span)
                const acadGrid = document.getElementById('academic-grid');
                acadGrid.innerHTML = data.academic.map(acad => `
                    <div class="card click-expand-node long-span-card" data-title="${acad.institution}" data-category="ACADEMIC_INFRASTRUCTURE" data-details="${acad.extended_details}" data-tags="${acad.degree},${acad.timeline}">
                        <h3>${acad.institution}</h3>
                        <p>${acad.degree} in ${acad.major}</p>
                        <div class="tags">
                            <span class="tag mono">${acad.timeline}</span>
                            <span class="tag mono" style="color:#10b981;">${acad.status}</span>
                        </div>
                    </div>
                `).join('');

                // Render Skills Matrix Loop
                const skillsGrid = document.getElementById('skills-grid');
                skillsGrid.innerHTML = data.skills.map(skill => `
                    <div class="card click-expand-node" data-title="${skill.category}" data-category="SKILL_MATRIX_REGISTRY" data-details="${skill.extended_details}" data-tags="${skill.items.join(',')}">
                        <h3>${skill.category}</h3>
                        <div class="tags" style="margin-top:16px;">
                            ${skill.items.map(i => `<span class="tag">${i}</span>`).join('')}
                        </div>
                    </div>
                `).join('');

                // Render Registries Loop
                const regGrid = document.getElementById('registries-grid');
                regGrid.innerHTML = data.registries.map(reg => `
                    <div class="card click-expand-node" data-title="${reg.title}" data-category="ACTIVE_REGISTRY_BLOCK" data-details="${reg.extended_details}" data-tags="${reg.tags.join(',')}">
                        <h3>${reg.title}</h3>
                        <p>${reg.description}</p>
                        <div class="tags">
                            ${reg.tags.map(t => `<span class="tag mono">${t}</span>`).join('')}
                        </div>
                    </div>
                `).join('');

                // Render Vertical Side Social Card
                const socialRail = document.getElementById('socials-vertical-rail');
                socialRail.innerHTML = `
                    <a href="${data.github_url}" target="_blank" rel="noopener noreferrer" class="card social-card-vertical">
                        <svg class="github-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                        </svg>
                        <div class="social-text-block">
                            <h3>Open Source Core</h3>
                            <p>Track my active repositories and environment streams live on @red-android.</p>
                        </div>
                        <span class="mono tracking-label">CONNECT_GATE →</span>
                    </a>
                `;

                initializeScrollWatcher();
                initializeCursorInteractions();
                initializeOverlayEngine();

            } catch (error) {
                console.error("Data tracking initialization failed:", error);
            }
        }

        // Smooth Scroll Viewport Interceptors
        function initializeScrollWatcher() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.05 });

            document.querySelectorAll('section').forEach(section => {
                observer.observe(section);
            });
        }

        // ==========================================================================
        // DYNAMIC KINETIC BLAST OVERLAY ENGINE
        // ==========================================================================
        function initializeOverlayEngine() {
            const overlayPanel = document.getElementById('system-overlay-panel');
            const overlayBox = document.getElementById('system-overlay-box');
            const pageWrapper = document.getElementById('master-page-wrapper');
            const closeBtn = document.getElementById('overlay-close-btn');
            const expandNodes = document.querySelectorAll('.click-expand-node');

            const overlayNodeId = document.getElementById('overlay-node-id');
            const overlayTitle = document.getElementById('overlay-title');
            const overlayTags = document.getElementById('overlay-tags');
            const overlayDesc = document.getElementById('overlay-desc');

            let sourceNode = null; 

            expandNodes.forEach(node => {
                node.addEventListener('click', () => {
                    sourceNode = node;
                    const rect = node.getBoundingClientRect();

                    overlayBox.style.setProperty('--origin-top', `${rect.top + (rect.height / 2)}px`);
                    overlayBox.style.setProperty('--origin-left', `${rect.left + (rect.width / 2)}px`);

                    overlayNodeId.textContent = `NODE_READOUT // ${node.getAttribute('data-category')}`;
                    overlayTitle.textContent = node.getAttribute('data-title');
                    overlayDesc.textContent = node.getAttribute('data-details');
                    overlayTags.innerHTML = node.getAttribute('data-tags').split(',').map(t => `<span class="tag mono">${t}</span>`).join('');

                    overlayPanel.classList.add('panel-active');
                    pageWrapper.classList.add('blurred-state');
                });
            });

            function collapsePanelGate() {
                if (!sourceNode) return;
                const rect = sourceNode.getBoundingClientRect();
                
                overlayBox.style.setProperty('--origin-top', `${rect.top + (rect.height / 2)}px`);
                overlayBox.style.setProperty('--origin-left', `${rect.left + (rect.width / 2)}px`);

                overlayPanel.classList.remove('panel-active');
                pageWrapper.classList.remove('blurred-state');
            }

            closeBtn.addEventListener('click', collapsePanelGate);
            overlayPanel.addEventListener('click', (e) => { if (e.target === overlayPanel) collapsePanelGate(); });
        }

        // ==========================================================================
        // DYNAMIC MOUSE CORE POSITION CODESPACE (PHYSICS ENGINE)
        // ==========================================================================
        const cursorDot = document.querySelector('.custom-cursor-dot');
        const cursorRing = document.querySelector('.custom-cursor-ring');

        let mouseX = 0, mouseY = 0; 
        let ringX = 0, ringY = 0;   

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            cursorDot.style.left = `${mouseX}px`;
            cursorDot.style.top = `${mouseY}px`;
        });

        function renderCursorEngine() {
            ringX += (mouseX - ringX) * 0.15;
            ringY += (mouseY - ringY) * 0.15;
            
            cursorRing.style.left = `${ringX}px`;
            cursorRing.style.top = `${ringY}px`;
            
            requestAnimationFrame(renderCursorEngine);
        }
        requestAnimationFrame(renderCursorEngine); 

        function initializeCursorInteractions() {
            const interactiveElements = document.querySelectorAll('.card, .social-card-vertical, a, .tag, .overlay-close-trigger');
            
            interactiveElements.forEach(element => {
                element.addEventListener('mouseenter', () => {
                    cursorDot.classList.add('hover-active');
                    cursorRing.classList.add('hover-active');
                });
                element.addEventListener('mouseleave', () => {
                    cursorDot.classList.remove('hover-active');
                    cursorRing.classList.remove('hover-active');
                });
            });
        }

        document.addEventListener('mousedown', () => cursorRing.classList.add('click-active'));
        document.addEventListener('mouseup', () => cursorRing.classList.remove('click-active'));

        window.addEventListener('DOMContentLoaded', loadPortfolio);
    </script>
</body>
</html>
